[project]
name = "music-video-maker-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "demucs>=4.0.1",
    "fastapi>=0.143.0",
    "librosa>=1.0.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "soundfile>=0.14.0",
    "stable-ts>=2.19.1",
    "uvicorn[standard]>=0.54.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
